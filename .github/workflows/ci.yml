name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  cpu-core:
    name: CPU core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --release
      - name: Verify Rust crate packaging
        if: runner.os == 'Linux'
        run: cargo package --locked -p meshers-core
      - run: cargo run --locked --release --example gyroid
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  python-bindings:
    name: Python bindings (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.12 also runs the cross-platform geometry and stiffness comparisons.
        python: ['3.11', '3.12', '3.15']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates/meshers-python
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install --system maturin
      - run: maturin build --locked --release --interpreter python --out dist
      - run: |
          uv pip install --system --only-binary :all: dist/*.whl "meshers[test]"
      - run: python -m pytest tests -q
      - name: Fetch the independent geometry validator
        if: matrix.python == '3.12'
        uses: actions/checkout@v4
        with:
          ref: 602dc900cd028d205b36e29dcdb5b4a9cf4f581a
          path: .local-work/coverage-reference
          sparse-checkout: benchmarks/microgen/microgen_benchmark
          persist-credentials: false
      - name: Check eight-cell sheet and lattice recipes against the historical limits
        if: matrix.python == '3.12'
        working-directory: .
        run: |
          uv pip install --system scipy
          reference=.local-work/coverage-reference/benchmarks/microgen
          mkdir coverage-results
          status=0
          for specimen in gyroid schwarz-p neovius graded-gyroid thin-gyroid implicit-lattice; do
            for passes in 0 4 12; do
              options=(--adapt)
              case "$specimen:$passes" in
                gyroid:*|schwarz-p:4) options=() ;;
                thin-gyroid:0) options+=(--adapt-tolerance 0.008) ;;
                implicit-lattice:0) options+=(--adapt-tolerance 0.006) ;;
              esac
              python demos/solver/implicit_coverage.py --reference "$reference" --case "$specimen" --passes "$passes" "${options[@]}" --require-admitted --output "coverage-results/$specimen-$passes.json" || status=1
            done
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python == '3.12'
        with:
          name: implicit-coverage-${{ matrix.os }}
          path: coverage-results/*.json
          if-no-files-found: ignore
      - name: Check candidate Schwarz geometry and effective stiffness
        if: matrix.python == '3.12'
        working-directory: .
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          RAYON_NUM_THREADS: '1'
        run: |
          uv pip install --system fedoo==1.0.0b2
          python demos/solver/schwarz_workflow.py native-candidate candidate-acceptance
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python == '3.12'
        with:
          name: schwarz-candidate-acceptance-${{ matrix.os }}
          path: candidate-acceptance/result.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python }}
          path: crates/meshers-python/dist/*.whl

  quality-and-docs:
    name: Python quality and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --all-packages --group docs
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run pytest crates/meshers-python/tests tools/tests -q
      - run: cargo fmt --manifest-path crates/meshers-python/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path crates/meshers-python/Cargo.toml --all-targets -- -D warnings
      - run: cargo run --locked --release --example implicit_sphere
      - run: uv run --with scipy python demos/solver/convergence.py
      - run: uv run --with fedoo==0.8.4 python demos/solver/fedoo_convergence.py
      - name: Exercise geometry and solver admission under optimized Python
        run: >-
          uv run --with fedoo==1.0.0b2 python -O -m pytest -q
          tools/tests/test_fedoo_cg.py tools/tests/test_periodic_geometry.py
          tools/tests/test_schwarz_series.py tools/tests/test_schwarz_repair.py
          tools/tests/test_schwarz_trials.py tools/tests/test_schwarz_candidate.py
      - run: uv run --with fedoo==1.0.0b2 python demos/solver/fedoo_homogenization.py
      - uses: actions/upload-artifact@v4
        with:
          name: solver-verification
          path: |
            docs/solver-convergence-results.json
            docs/fedoo-convergence-results.json
            docs/fedoo-homogenization-results.json
      - run: uv run --group docs python tools/build_docs.py
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: site/
