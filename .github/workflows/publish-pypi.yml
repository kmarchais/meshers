name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful Release artifacts run for this exact main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/meshers/
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Require successful checks on this exact main commit
        uses: actions/github-script@v7
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        with:
          script: |
            const id = process.env.ARTIFACT_RUN_ID;
            if (!/^[0-9]+$/.test(id)) throw new Error('Expected a numeric artifact run ID');
            const repo = context.repo;
            const {data: artifactRun} = await github.rest.actions.getWorkflowRun({...repo, run_id: Number(id)});
            if (artifactRun.head_sha !== context.sha || artifactRun.head_branch !== 'main' ||
                artifactRun.event !== 'push' || artifactRun.conclusion !== 'success' ||
                artifactRun.path !== '.github/workflows/release.yml') {
              throw new Error('Artifacts must come from a successful main push at this exact commit');
            }
            for (const workflow_id of ['ci.yml', 'coverage.yml', 'performance.yml', 'release.yml']) {
              const {data} = await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id, head_sha: context.sha, branch: 'main', event: 'push', per_page: 100
              });
              if (!data.workflow_runs.length || data.workflow_runs[0].conclusion !== 'success') {
                throw new Error(`${workflow_id} has not passed for this commit`);
              }
            }
            core.info(`Publishing tested artifacts from ${context.sha}, run ${id}`);
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
          pattern: meshers-*
          merge-multiple: true
          path: dist
      - name: Verify distribution versions and record hashes
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import tomllib
          import zipfile
          from email.parser import BytesParser
          root = pathlib.Path('.')
          version = tomllib.loads((root / 'crates/meshers-python/pyproject.toml').read_text())['project']['version']
          files = sorted((root / 'dist').iterdir())
          wheels = [p for p in files if p.suffix == '.whl']
          assert len(files) == 5 and len(wheels) == 4, 'Expected four wheels and one source archive'
          assert (root / 'dist' / f'meshers-{version}.tar.gz').is_file()
          for path in wheels:
              with zipfile.ZipFile(path) as archive:
                  metadata = BytesParser().parsebytes(archive.read(f'meshers-{version}.dist-info/METADATA'))
                  assert metadata['Name'] == 'meshers' and metadata['Version'] == version
          for path in files:
              print(hashlib.sha256(path.read_bytes()).hexdigest(), path.name)
          PY
      - name: Publish the tested distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
