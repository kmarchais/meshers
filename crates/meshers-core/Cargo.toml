[package]
name = "meshers-core"
description = "CPU tetrahedral meshing of implicit solids and constrained intersections"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
experimental-surfaces = []

[dependencies]
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
