[project]
name = "meshers-microgen-benchmark"
version = "0.1.0"
description = "Reproducible Microgen tetrahedral meshing and elastic accuracy comparisons"
requires-python = ">=3.12"
dependencies = [
  "meshers==0.1.0", "microgen>=2.0.0b1,<3", "mmgpy>=0.17,<0.18",
  "numpy>=1.26,<3", "scipy>=1.14,<2", "pyvista>=0.46,<0.50", "psutil>=5.9",
]

[project.scripts]
microgen-benchmark = "microgen_benchmark.runner:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
microgen_benchmark = ["report.html"]

[tool.setuptools]
packages = ["microgen_benchmark"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16.7"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
