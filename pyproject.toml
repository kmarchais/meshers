[project]
name = "meshers-development"
version = "0.2.1"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["crates/meshers-python"]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "ty",
    "pytest>=8",
    "pyfive>=1.2.1",
    "vtk>=9.7",
    "pyvista>=0.46",
    "maturin>=1.9,<2",
    "psutil>=7.2.2",
    "pytest-cov>=7.1.0",
]
docs = ["zensical", "mkdocstrings-python"]

[tool.ruff]
preview = true
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# The formatter controls trailing commas. The repository has a shared license.
# Keep exception messages inline; requiring a temporary variable adds no value here.
ignore = ["missing-trailing-comma", "missing-copyright-notice", "raise-vanilla-args", "raw-string-in-exception", "f-string-in-exception"]

[tool.ruff.lint.per-file-ignores]
# The gate launches wheel-specific Python workers and imports their dependencies on demand.
"tools/performance_gate.py" = ["import-outside-top-level", "print", "suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
# Tests exercise private diagnostics and use small callbacks and literal expectations.
"**/tests/**" = ["undocumented-public-module", "undocumented-public-function", "ANN", "assert", "magic-value-comparison", "private-member-access", "implicit-namespace-package", "import-private-name"]
"crates/meshers-python/examples/*.py" = ["print", "implicit-namespace-package"]
# Scalar expression protocols intentionally have dynamic operands and many operators.
"crates/meshers-python/python/meshers/expression.py" = ["too-many-public-methods", "float-equality-comparison"]
# Public Python signatures retain the compile keyword and document native exceptions.
"crates/meshers-python/python/meshers/volume.py" = ["too-many-arguments", "builtin-argument-shadowing", "docstring-extraneous-exception"]
"crates/meshers-python/python/meshers/mesh.py" = ["import-outside-top-level"]  # Optional VTK exporter.
"crates/meshers-python/python/meshers/intersection.py" = ["too-many-arguments", "builtin-argument-shadowing", "docstring-extraneous-exception"]
# Stub docstrings feed the generated API reference.
"crates/meshers-python/python/meshers/_meshers.pyi" = ["docstring-in-stub"]
# Solver demos use array callbacks, numerical tolerances and console reports.
"demos/solver/*.py" = ["ANN", "magic-value-comparison", "print", "implicit-namespace-package"]

[tool.ruff.lint.pylint]
allow-dunder-method-names = ["__array__", "__array_function__", "__array_ufunc__"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.11"
root = ["crates/meshers-python/python", ".", "tools"]

[tool.ty.src]
include = ["crates/meshers-python/python", "tools/performance_gate.py"]
