[project]
name = "meshers-development"
version = "0.2.1"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["crates/meshers-python"]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "ty",
    "pytest>=8",
    "pyfive>=1.2.1",
    "vtk>=9.7",
    "pyvista>=0.46",
    "maturin>=1.9,<2",
    "psutil>=7.2.2",
    "pytest-cov>=7.1.0",
]
docs = ["zensical", "mkdocstrings-python"]

[tool.ruff]
preview = true
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# The formatter controls trailing commas. The repository has a shared license.
# Keep exception messages inline; requiring a temporary variable adds no value here.
ignore = ["missing-trailing-comma", "missing-copyright-notice", "raise-vanilla-args", "raw-string-in-exception", "f-string-in-exception"]

[tool.ruff.lint.per-file-ignores]
# Benchmark orchestration uses fixed subprocess argument lists and explicit metric loops.
"tools/performance_gate.py" = ["ANN", "import-outside-top-level", "magic-value-comparison", "print", "suspicious-subprocess-import", "subprocess-without-shell-equals-true", "complex-structure"]
# Tests/examples intentionally use assertions, simple callback names and direct output.
"**/tests/**" = ["undocumented-public-module", "undocumented-public-function", "ANN", "assert", "magic-value-comparison", "unused-function-argument", "private-member-access", "import-outside-top-level", "subprocess-without-shell-equals-true", "suspicious-subprocess-import", "implicit-namespace-package", "unused-lambda-argument", "import-private-name"]
"crates/meshers-python/examples/*.py" = ["ANN", "print", "implicit-namespace-package"]
# Scalar expression protocols intentionally have dynamic operands and many operators.
"crates/meshers-python/python/meshers/expression.py" = ["missing-type-function-argument", "missing-type-args", "missing-type-kwargs", "missing-return-type-private-function", "missing-return-type-special-method", "bad-dunder-method-name", "too-many-public-methods", "eq-without-hash", "private-member-access", "complex-structure", "too-many-return-statements", "too-many-branches", "float-equality-comparison", "magic-value-comparison"]
# Python facade re-exports the public API and mirrors meshing options.
"crates/meshers-python/python/meshers/__init__.py" = ["non-empty-init-module", "too-many-arguments", "builtin-argument-shadowing", "import-outside-top-level", "magic-value-comparison", "docstring-extraneous-exception"]
# The intersection facade follows the existing public mesher options and validates exact cap coordinates.
"crates/meshers-python/python/meshers/intersection.py" = ["too-many-arguments", "builtin-argument-shadowing", "import-outside-top-level", "magic-value-comparison", "docstring-extraneous-exception"]
# Stub Any marks the FFI boundary; stub docstrings feed generated API docs.
"crates/meshers-python/python/meshers/_meshers.pyi" = ["any-type", "docstring-in-stub"]
# Solver demos use array callbacks, numerical tolerances and console reports.
"demos/solver/*.py" = ["ANN", "magic-value-comparison", "print", "implicit-namespace-package"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.11"
root = ["crates/meshers-python/python"]

[tool.ty.src]
include = ["crates/meshers-python/python"]
