[project]
name = "meshers-development"
version = "0.2.1"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["crates/meshers-python"]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "ty",
    "pytest>=8",
    "pyfive>=1.2.1",
    "vtk>=9.7",
    "pyvista>=0.46",
    "maturin>=1.9,<2",
    "psutil>=7.2.2",
    "pytest-cov>=7.1.0",
    "defusedxml>=0.7.1",
]
docs = ["zensical", "mkdocstrings-python"]

[tool.ruff]
preview = true
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# Test functions and numerical callbacks may omit parameter and return annotations.
# Variadic arguments, special methods and explicit Any remain checked.
"**/tests/**" = [
    "undocumented-public-function",
    "missing-type-function-argument",
    "missing-return-type-undocumented-public-function",
    "missing-return-type-private-function",
    "assert",
    "magic-value-comparison",
    "private-member-access",
    "implicit-namespace-package",
    "import-private-name",
]
"crates/meshers-python/examples/*.py" = ["print", "implicit-namespace-package"]
# Stub docstrings feed the generated API reference.
"crates/meshers-python/python/meshers/_meshers.pyi" = ["docstring-in-stub"]
# Solver demos run by filename and import siblings from the script directory.
"demos/solver/*.py" = ["implicit-namespace-package"]
# Existing numerical studies still have untyped functions. New scripts and the
# reporting, checking, plotting and audit entry points use normal annotation rules.
"demos/solver/{historical_schwarz_repair,implicit_coverage,periodic_geometry,release_wheel_comparison,schwarz_diagnostics,schwarz_series,schwarz_trials,schwarz_workflow,spinodoid_witness}.py" = [
    "missing-type-function-argument",
    "missing-return-type-undocumented-public-function",
    "missing-return-type-private-function",
]

[tool.ruff.lint.pylint]
allow-dunder-method-names = ["__array__", "__array_function__", "__array_ufunc__"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.11"
root = ["crates/meshers-python/python", ".", "tools"]

[tool.ty.src]
include = ["crates/meshers-python/python", "tools/performance_gate.py", "tools/performance_worker.py", "tools/commands.py"]
