[project]
name = "meshers-development"
version = "0.2.1"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["crates/meshers-python"]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "ty",
    "pytest>=8",
    "pyfive>=1.2.1",
    "vtk>=9.7",
    "pyvista>=0.46",
    "maturin>=1.9,<2",
    "psutil>=7.2.2",
    "pytest-cov>=7.1.0",
]
docs = ["zensical", "mkdocstrings-python"]

[tool.ruff]
preview = true
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# One repository license covers the Python sources.
ignore = ["missing-copyright-notice"]

[tool.ruff.lint.per-file-ignores]
# Each benchmark worker imports the dependencies of the wheel being measured.
"tools/performance_gate.py" = ["import-outside-top-level"]
# Test functions and numerical callbacks may omit parameter and return annotations.
# Variadic arguments, special methods and explicit Any remain checked.
"**/tests/**" = [
    "undocumented-public-function",
    "missing-type-function-argument",
    "missing-return-type-undocumented-public-function",
    "missing-return-type-private-function",
    "assert",
    "magic-value-comparison",
    "private-member-access",
    "implicit-namespace-package",
    "import-private-name",
]
"crates/meshers-python/examples/*.py" = ["print", "implicit-namespace-package"]
# Symbolic simplification and interpolation knot ties require exact equality.
"crates/meshers-python/python/meshers/expression.py" = ["float-equality-comparison"]
# Stub docstrings feed the generated API reference.
"crates/meshers-python/python/meshers/_meshers.pyi" = ["docstring-in-stub"]
# Scientific scripts may omit types on ordinary functions and use literal numerical thresholds.
"demos/solver/*.py" = [
    "missing-type-function-argument",
    "missing-return-type-undocumented-public-function",
    "missing-return-type-private-function",
    "magic-value-comparison",
    "implicit-namespace-package",
]

[tool.ruff.lint.pylint]
allow-dunder-method-names = ["__array__", "__array_function__", "__array_ufunc__"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.11"
root = ["crates/meshers-python/python", ".", "tools"]

[tool.ty.src]
include = ["crates/meshers-python/python", "tools/performance_gate.py"]
